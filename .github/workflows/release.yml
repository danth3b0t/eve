name: Release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: eve-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Official v7 tag commits, resolved and reviewed on 2026-09-11.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Core tests (no live Convex credentials or app runtimes)
        run: CGO_ENABLED=0 go test -mod=readonly ./... -count=1
      - run: go vet -mod=readonly ./...

  draft:
    name: Build assets and create reviewable draft
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build four binaries and checksums
        env:
          EVE_VERSION: ${{ github.ref_name }}
        run: sh scripts/release.sh
      - name: Create draft (does not publish to users)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # Explicit asset list; do not upload arbitrary files from dist/.
          # An existing release causes failure rather than overwriting assets.
          gh release create "$RELEASE_TAG" \
            dist/eve-linux-amd64 \
            dist/eve-linux-arm64 \
            dist/eve-darwin-amd64 \
            dist/eve-darwin-arm64 \
            dist/SHA256SUMS.txt \
            --verify-tag --draft --generate-notes \
            --title "EVE $RELEASE_TAG" \
            "${flags[@]}"
